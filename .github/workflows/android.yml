name: android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, tests y lint
        run: ./gradlew assembleDebug test lint --console=plain

      - name: Reportes de lint y tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes
          path: |
            app/build/reports/
            core/build/reports/

      - name: APK debug
        uses: actions/upload-artifact@v4
        with:
          name: metalmind-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
